name: Build

on:
  push:
    branches:
      - '**'
    paths:
      - .github/workflows/build.yml
      - stm32f446retx_flash.ld
      - startup_stm32f446xx.s
      - CMakeLists.txt
      - Drivers/**
      - Core/**
      - Src/**

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # os:   [ ubuntu, windows ]
        type: [ debug, release ]

    # runs-on: ${{ matrix.os }}-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # with:
        #   submodules: recursive

      - name: Install build tools for Linux
      # if: ${{ matrix.os == 'ubuntu' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi

    # - name: Cache ARM GCC Toolchain
    #   id: cache-gcc
    #   uses: actions/cache@v4
    #   if: ${{ matrix.os == 'windows' }}
    #   with:
    #     path: C:\Tools\gcc-arm-none-eabi
    #     key: arm-gcc-14.2.rel1

    # - name: Install build tools Windows
    #   if: ${{ matrix.os == 'windows' && steps.cache-gcc.outputs.cache-hit != 'true' }}
    #   run: |
    #     curl -LO https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-mingw-w64-x86_64-arm-none-eabi.exe
    #     Start-Process -Wait -FilePath .\arm-gnu-toolchain-14.2.rel1-mingw-w64-x86_64-arm-none-eabi.exe -ArgumentList "/S"
    #     echo "C:\Program Files (x86)\GNU Arm Embedded Toolchain\14.2.rel1\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        run: cmake -G Ninja -DCMAKE_BUILD_TYPE="${{ matrix.type }}"
        working-directory: FC_firmware

      - name: Build
        run: cmake --build .
        working-directory: FC_firmware

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          # name: "firmware-${{ matrix.os }}-${{ matrix.type }}"
          name: "firmware-${{ matrix.type }}"
          path: FC_firmware/FC_firmware.bin
          if-no-files-found: error
